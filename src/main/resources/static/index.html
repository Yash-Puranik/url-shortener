<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShortLink</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    input { width: 75%; padding: 10px; font-size: 15px; }
    button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>ShortLink URL Shortener</h2>
  <input id="urlInput" type="url" placeholder="https://example.com/very/long/url" />
  <button onclick="shorten()">Shorten</button>
  <div id="result"></div>

  <script>
    async function shorten() {
      const originalUrl = document.getElementById("urlInput").value.trim();
      const resultEl = document.getElementById("result");
      const res = await fetch("/api/v1/urls", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ originalUrl })
      });
      if (res.status === 429) {
        resultEl.innerText = "Rate limit exceeded (429). Wait a moment and try again.";
        return;
      }
      if (!res.ok) {
        const errText = await res.text();
        resultEl.innerText = `Error ${res.status}: ${errText}`;
        return;
      }
      if (!res.ok) {
        resultEl.innerText = "Invalid URL. Include http:// or https://";
        return;
      }
      const data = await res.json();
      resultEl.innerHTML = `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
    }
  </script>
</body>
</html>
